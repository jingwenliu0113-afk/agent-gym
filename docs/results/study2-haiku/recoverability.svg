<title id="t">Study 2 recoverability（Claude Haiku 5.5）：P(success | k)</title>
<desc id="d">0 個 source，依級別分段、每列一個題型、每欄一個 seed。實心點：P(success | k)；空心點：P(success ∧ safe | k)。RQ1：沒有 sweep。數值見 summary.json。</desc>
