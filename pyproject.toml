[project]
name = "agent-gym"
version = "0.0.1"
description = "Agent Gym + Replay: resettable, replayable stateful environment for agent recoverability research"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
llm = [
    "anthropic>=1.12.1",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
